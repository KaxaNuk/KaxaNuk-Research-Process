[project]
name = "kn-research-process"
version = "0.6.0"
license = "MIT"
# The ceiling is the Backtest Engine's, not this repository's: its quick start states Python 3.12
# or 3.13, and every performance figure here comes from that engine, so a version it cannot be
# installed beside is a version that cannot finish the pipeline.  The Data Curator allows 3.12 to
# 3.14, so 3.13 is the one to install.  Widen this when the engine supports 3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "kaxanuk-data-curator>=0.49.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "apm-cli>=0.28.0",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

# Ruff enforces the house style described in AGENTS.md, so the rules are checkable rather than
# merely written down.  Run it without installing anything:
#
#     uvx ruff check .
#
# Rulesets left deliberately unselected, because they contradict the house style:
#
#   UP  - would rewrite quoted annotations into `from __future__` imports, which the style guide
#         forbids outright; quoted annotations are the prescribed alternative.
#   RET - RET504 would inline `result = ...; return result`, but the guide keeps the intermediate
#         variable on purpose, so the object survives for a debugger to look at.
#   PL  - PLC0415 would flag an import made inside a guard, which the licensed engines need:
#         they are optional and absent from a fresh clone.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "C4",
    "E",
    "F",
    "I",
    "N",
    "SIM",
    "W",
]
ignore = [
    # Fires on `TRADING_DAYS[TRADING_DAYS >= first_day]`, reading an UPPERCASE name as a literal.
    # The house style requires constants to be uppercase, so this rule misfires by construction,
    # and its suggested rewrite (`first_day <= TRADING_DAYS`) reads worse inside a filter.
    "SIM300",
]

# A notebook resolves the repository root and puts a directory on the import path before importing
# from it.  The import cannot come first: there is nothing to import from until the path is set.
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

# KaxaNuk libraries are third-party, but reading them in their own block is how you see at a
# glance which stage of the platform a module sits on.  A module imported by bare name from a
# directory that is not a package belongs in `known-local-folder`, or Ruff files it alongside
# numpy and pandas.
[tool.ruff.lint.isort]
known-local-folder = []
section-order = [
    "future",
    "standard-library",
    "third-party",
    "kaxanuk",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
kaxanuk = ["kaxanuk"]
