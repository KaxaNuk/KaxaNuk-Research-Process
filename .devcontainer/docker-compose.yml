# Without this, Compose names the project after its directory -- ".devcontainer" -- which every
# KaxaNuk repository shares. Two checkouts then land in the same project, each seeing the other's
# container as an orphan, and `docker compose down --remove-orphans` in one stops the other.
name: kn-research-process

services:
  workspace-knrp:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    # API credentials, read from the gitignored Config/.env if it exists so the
    # variables can come from the repo rather than the host shell.
    # NOTE: env_file only injects variables *inside* the container. It cannot
    # supply the ${...} interpolation below -- that resolves from the host shell
    # or from .devcontainer/.env, this file's Compose project directory.
    env_file:
      - path: ../Config/.env
        required: false

    # Config/.env above supplies the API keys directly:
    #   KNDC_API_KEY_FMP    -- Data Curator (FMP). Required for Universe/ and Data/.
    #   KNBE_API_KEY_KAXANUK, KNAA_API_KEY_KAXANUK
    #                       -- Licensed KaxaNuk packages. Only for the backtest and
    #                          attribution steps under Experiments/.
    # They are deliberately NOT relisted here: an `environment:` entry outranks
    # env_file, so a bare `- KNDC_API_KEY_FMP` that is unset in the host shell
    # shadows the value from Config/.env and the container sees nothing.
    environment:
      # Jupyter server token. Written as an explicit interpolation rather than a
      # bare pass-through because it lives in .devcontainer/.env, which Compose
      # loads for interpolation only.
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}

    ports:
      # The :-8888 default is load-bearing. With an unset variable this line
      # collapses to ":8888", which tells Docker to publish on a *random* host
      # port -- the IDE then dials 8888 and gets connection refused.
      - "${JUPYTER_PORT:-8888}:8888"

    volumes:
      # The live checkout, mounted over the copy the image was built from. The
      # Dockerfile already assumes this -- it installs the project environment
      # into /opt/venv precisely so a mount over /workspace cannot shadow it.
      #
      # Without this the container runs against the build-time snapshot, which
      # .dockerignore strips every .csv from: no Investable_Universe.csv, no
      # downloaded data, and nothing written inside would survive the container.
      # An IDE opening the devcontainer adds its own mount, but `docker compose
      # up` on its own does not, so it is declared here for both paths.
      - ..:/workspace
